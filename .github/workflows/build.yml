name: Build Flok

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flok-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  web:
    name: HTML / PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack web build
        run: |
          cd web
          zip -r ../Flok-HTML.zip . -x "*.map"
      - uses: actions/upload-artifact@v4
        with:
          name: Flok-Web
          path: Flok-HTML.zip
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Add Android platform
        run: npx cap add android
      - name: Sync web assets
        run: npx cap sync android
      - name: Apply Flok branding
        run: bash scripts/brand-android.sh android
      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Sign APK
        run: |
          set -e
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          KEYSTORE="$RUNNER_TEMP/flok.keystore"
          keytool -genkeypair -v -keystore "$KEYSTORE" -alias flok -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass flok-release -keypass flok-release -dname "CN=Flok, O=Flok, C=RU" >/dev/null 2>&1
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BT=$(ls "$SDK/build-tools" | sort -V | tail -1)
          "$SDK/build-tools/$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$SDK/build-tools/$BT/apksigner" sign --ks "$KEYSTORE" --ks-pass pass:flok-release \
            --key-pass pass:flok-release --out Flok-Android.apk "$RUNNER_TEMP/aligned.apk"
          ls -lh Flok-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Flok-APK
          path: Flok-Android.apk
          if-no-files-found: error

  windows:
    name: Windows EXE
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Copy web app
        run: Copy-Item -Recurse -Force web desktop/web
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Build installer and portable EXE
        working-directory: desktop
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Flok-Windows
          path: dist/windows/*.exe
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [web, android, windows]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Show files
        run: find artifacts -type f -maxdepth 3 -printf "%p %k KB\n"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: Flok 1.0.0
          body: |
            **Flok** — мессенджер с подарками, маркетом и кликером.

            - **APK** — установить на Android (подписан, ставится поверх обновлений)
            - **Setup.exe** — установщик для Windows
            - **Portable.exe** — версия без установки
            - **HTML.zip** — распаковать и открыть `index.html` (работает офлайн)

            В офлайн-режиме аккаунт, чаты и маркет живут на устройстве. Подключи свой Flok-сервер в настройках, чтобы общаться с реальными людьми.
          files: |
            artifacts/Flok-APK/Flok-Android.apk
            artifacts/Flok-Windows/*.exe
            artifacts/Flok-Web/Flok-HTML.zip
          fail_on_unmatched_files: false

  pages:
    name: GitHub Pages
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
